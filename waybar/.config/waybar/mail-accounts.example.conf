# Accounts counted by the waybar mail module (scripts/mail.py).
# Copy to ~/.config/waybar/mail-accounts.conf (a real file, outside the dotfiles,
# since addresses are private) and restart: systemctl --user restart waybar-mail
#
# One account per line:  <label> <imap host> <port> <ssl|starttls> <imap username>
# Each password is read from the Secret Service (KeePassXC), stored once with:
#   secret-tool store --label="waybar-mail <username>" service waybar-mail user <username>

Proton  127.0.0.1       1143  starttls  me@example.com
Gmail   imap.gmail.com  993   ssl       me@gmail.com
