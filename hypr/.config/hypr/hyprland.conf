# ~/.config/hypr/hyprland.conf

# 1. MONITOR
monitor=eDP-1,1920x1080@144,auto,1.2

# 2. PROGRAMS
$terminal = kitty
$fileManager = yazi
$menu = rofi -show drun -show-icons
$browser = firefox

# NVIDIA Wayland Environment Variables
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# Fix for cursor rendering issues on NVIDIA
cursor {
    no_hardware_cursors = true
}

# Allow the calendar to float and ignore centering
windowrule = match:class ^(yad)$, float on, move 40% 35, pin on, center 0

# 3. AUTOSTART
exec-once = waybar
exec-once = wako
exec-once = /home/johnlocke/scripts/ricing/change_wallpaper.sh
exec-once = [workspace 1 silent] $terminal
exec-once = [workspace 2 silent] $browser
exec-once = [workspace 8 silent] keepassxc

# 4. Inputs / Periphericals
source = /home/johnlocke/.config/hypr/conf/input.conf

# 5/ Keybinds
source = /home/johnlocke/.config/hypr/conf/keybinds.conf

# 6. LOOK & FEEL (Simplified)
general {
    gaps_in = 2
    gaps_out = 3
    border_size = 1
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 2
    blur {
        enabled = true
        size = 3
        passes = 1
    }
    shadow {
	enabled = false
    }
}

animations {
    enabled = yes
    # Accelerated animations: shortened durations from ~7 to 3-4
    bezier = sharp, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 3, sharp
    animation = windowsOut, 1, 3, default, popin 80%
    animation = border, 1, 2, default
    animation = fade, 1, 3, default
    animation = workspaces, 1, 3, default
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

xwayland {
    force_zero_scaling = true
}


