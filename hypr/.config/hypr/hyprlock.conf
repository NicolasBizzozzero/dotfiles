# hyprlock: lock screen styled like waybar and the rofi menus
# (JetBrainsMono Nerd Font, square corners, tokyonight colors, French date)

$font = JetBrainsMono Nerd Font

$white  = rgba(ffffffff)
$muted  = rgba(c0caf5ff)
$blue   = rgba(7aa2f7ff)
$green  = rgba(b9f27cff)
$yellow = rgba(f3f809ff)
$red    = rgba(df3320ff)

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# Current wallpaper (linked by ~/scripts/ricing/change_wallpaper.sh), blurred and
# darkened; plain black if the link is missing
background {
    monitor =
    path = /home/johnlocke/.cache/current_wallpaper
    color = rgba(000000ff)
    blur_passes = 3
    blur_size = 8
    brightness = 0.45
}

# LOCK ICON
label {
    monitor =
    text = 
    color = $blue
    font_size = 22
    font_family = $font

    position = 0, 220
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = <b>$TIME</b>
    color = $white
    font_size = 96
    font_family = $font

    position = 0, 120
    halign = center
    valign = center
}

# DATE, in French like the bar clock
label {
    monitor =
    text = cmd[update:60000] date +"%A %d %B"
    color = $muted
    font_size = 18
    font_family = $font

    position = 0, 30
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 46
    rounding = 0
    outline_thickness = 2

    inner_color = rgba(000000d9)
    outer_color = $blue
    check_color = $green
    fail_color = $red
    capslock_color = $yellow

    font_color = $white
    font_family = $font
    fade_on_empty = false
    placeholder_text = <i>Password</i>
    fail_text = <b>$PAMFAIL</b>

    dots_size = 0.25
    dots_spacing = 0.4
    dots_center = true

    position = 0, -60
    halign = center
    valign = center
}

# BATTERY, bottom right like on the bar
label {
    monitor =
    text = cmd[update:30000] echo "<b>$(cat /sys/class/power_supply/BAT0/capacity)% </b>"
    color = $green
    font_size = 12
    font_family = $font

    position = -24, 18
    halign = right
    valign = bottom
}
