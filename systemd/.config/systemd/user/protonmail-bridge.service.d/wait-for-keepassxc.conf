# Added on top of the unit shipped by protonmail-bridge-core.
# Bridge reads its vault key from the Secret Service (KeePassXC). If that is
# locked when Bridge starts, the start fails, and after 3 failed starts Bridge
# switches to a new empty vault (the account is "forgotten"). So never start it
# before the KeePassXC database is unlocked: wait for it instead of failing.
[Unit]
StartLimitIntervalSec=0

[Service]
ExecStartPre=/usr/bin/sh -c 'until busctl --user get-property org.freedesktop.secrets /org/freedesktop/secrets/aliases/default org.freedesktop.Secret.Collection Locked 2>/dev/null | grep -q false; do sleep 5; done'
TimeoutStartSec=infinity
RestartSec=30
