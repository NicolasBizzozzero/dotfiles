; Reference copy of ~/.config/keepassxc/keepassxc.ini, copied by install.sh
; only when that file does not exist yet (KeePassXC rewrites the real file and
; stores its KeeShare private key in it, so the real file is not tracked).
; FdoSecrets: KeePassXC is the Secret Service (keyring) used by Proton Mail Bridge
; and the waybar mail module; ConfirmAccessItem=false so they can read without a prompt.
[General]
AutoGeneratePasswordForNewEntries=true
ConfigVersion=2

[Browser]
CustomProxyLocation=
Enabled=true
SearchInAllDatabases=true
UnlockDatabase=false

[FdoSecrets]
ConfirmAccessItem=false
Enabled=true
ShowNotification=false

[GUI]
ShowExpiredEntriesOnDatabaseUnlock=false
TrayIconAppearance=monochrome-light

[PasswordGenerator]
AdditionalChars=
ExcludedChars=

[Security]
LockDatabaseIdle=false
