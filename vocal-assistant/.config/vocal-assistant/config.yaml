  #     curl -sf --max-time 8 "https://wttr.in/Paris?format=%C,+%t&lang=fr&m"
  #     | sed 's/+\([0-9]*\)°C/\1 degrés/; s/-\([0-9]*\)°C/moins \1 degrés/'
