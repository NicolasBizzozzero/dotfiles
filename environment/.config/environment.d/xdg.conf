XDG_CONFIG_HOME=${HOME}/.config
XDG_DATA_HOME=${HOME}/.local/share
XDG_STATE_HOME=${HOME}/.local/state
XDG_CACHE_HOME=${HOME}/.cache

CLAUDE_CONFIG_DIR=${XDG_CONFIG_HOME}/claude

# Every .pyc in one tree under the cache, instead of __pycache__ folders next
# to the code: also for the user services (nightly syncs, voice assistant).
# Python then ignores existing __pycache__ folders, packaged ones included, and
# compiles each module once more after the cache is emptied.
PYTHONPYCACHEPREFIX=${XDG_CACHE_HOME}/python
