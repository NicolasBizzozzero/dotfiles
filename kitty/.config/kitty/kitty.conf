# --- Copy / Paste ---
copy_on_select yes
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# --- Keyboard Text Selection (Pass-through) ---
map shift+up    select_up
map shift+down  select_down
map ctrl+shift+left  no_op
map ctrl+shift+right no_op
map shift+left       no_op
map shift+right      no_op

# --- Pro Suggestions ---

# 1. Open URLs with your keyboard (Hints Mode)
# Press Ctrl+Shift+E, and every URL on screen gets a letter next to it. 
# Type the letter, and it opens in Firefox without touching your mouse!
map ctrl+shift+e open_url_with_hints

# 2. Scrollback Search
# Opens your entire terminal history in a searchable buffer (like Vim/less)
map ctrl+shift+f show_scrollback

# 3. Dynamic Font Resizing (Great for presentations or tired eyes)
map ctrl+plus change_font_size all +2.0
map ctrl+minus change_font_size all -2.0
map ctrl+0 change_font_size all 0

# --- Fonts ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# --- Window Layout & Padding ---
window_padding_width 15
hide_window_decorations yes
confirm_os_window_close 0

# --- Transparency ---
background_opacity 0.85
dynamic_background_opacity yes

# --- Color Scheme (Tokyo Night Dark) ---
background #1a1b26
foreground #c0caf5
selection_background #33467c
selection_foreground #c0caf5
url_color #73daca
cursor #c0caf5
cursor_text_color #1a1b26

